name: Core regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install mne==1.12.1 moabb==1.5.0 numpy==2.4.6 pandas==3.0.3 scikit-learn==1.9.0 matplotlib==3.10.9 seaborn==0.13.2 PyYAML==6.0.3 joblib==1.5.3
      - run: python -m unittest discover -s tests -v
